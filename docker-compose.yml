services:
  postgres:
    image: postgres:16-alpine
    container_name: patchproof-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchproof
      POSTGRES_PASSWORD: patchproof_secret
      POSTGRES_DB: patchproof
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchproof -d patchproof"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: patchproof_postgres_data
