
<svg width="960" height="680" viewBox="0 0 960 680" fill="none" xmlns="http://www.w3.org/2000/svg" style="background:#FFFFFF; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Header -->
  <text x="60" y="54" font-size="20" font-weight="700" fill="#0B0B0D" letter-spacing="-0.02em">PatchProof Brand Mark Exploration</text>
  <text x="60" y="78" font-size="13" font-weight="400" fill="#64748B">Six geometric concepts built on a 64×64 grid • Colors: Indigo-Blue (#5B6CFF) and Near-Black (#0B0B0D)</text>
  
  <!-- Row 1 -->
  <!-- Tile 1 -->
  <g transform="translate(60, 110)">
    <rect width="260" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(98, 65)">
      

  <path d="M12 12 C12 12 28 8 29 8 V56 C24 53 12 42 12 28 Z" fill="#0B0B0D" />
  <path d="M52 12 C52 12 36 8 35 8 V56 C40 53 52 42 52 28 Z" fill="#5B6CFF" />
  <!-- Stitched seam bars across center seam -->
  <rect x="25" y="16" width="14" height="3" rx="1.5" fill="#FFFFFF" />
  <rect x="25" y="26" width="14" height="3" rx="1.5" fill="#FFFFFF" />
  <rect x="25" y="36" width="14" height="3" rx="1.5" fill="#FFFFFF" />
  <rect x="25" y="46" width="14" height="3" rx="1.5" fill="#FFFFFF" />


    </g>
    <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0B0D">1. Stitched Shield</text>
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B">Two halves patched by precision seam</text>
  </g>

  <!-- Tile 2 -->
  <g transform="translate(350, 110)">
    <rect width="260" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(98, 65)">
      

  <!-- Base patch with top-right inset notch -->
  <path d="M10 20 C10 14.5 14.5 10 20 10 H40 V24 H54 V44 C54 49.5 49.5 54 44 54 H20 C14.5 54 10 49.5 10 44 Z" fill="#0B0B0D" />
  <!-- Indigo Proof Check seated in the patch notch -->
  <path d="M34 18 L43 27 L58 12" stroke="#5B6CFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />


    </g>
    <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0B0D">2. Notched Patch Check</text>
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B">Patch container with interlocking proof check</text>
  </g>

  <!-- Tile 3 (Selected Concept) -->
  <g transform="translate(640, 110)">
    <rect width="260" height="230" rx="12" fill="#F8FAFC" stroke="#5B6CFF" stroke-width="2" />
    <rect x="180" y="12" width="68" height="20" rx="10" fill="#5B6CFF" />
    <text x="214" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">SELECTED</text>
    <g transform="translate(98, 65)">
      

  <title>PatchProof Monogram P with Checkmark Counter</title>
  <!-- Architectural Stem in Near-Black -->
  <rect x="10" y="8" width="12" height="48" rx="2.5" fill="#0B0B0D" />
  <!-- Upper Loop in Solid Indigo-Blue -->
  <path d="M22 8 H39 C47.28 8 54 14.72 54 23 C54 31.28 47.28 38 39 38 H22 V8 Z" fill="#5B6CFF" />
  <!-- Precision Checkmark Counter (Negative Space / White) -->
  <path d="M27 23 L33 29 L46 16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />


    </g>
    <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0B0D">3. Monogram P + Check Counter</text>
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B">Engineered stem with verified counter check</text>
  </g>

  <!-- Row 2 -->
  <!-- Tile 4 -->
  <g transform="translate(60, 370)">
    <rect width="260" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(98, 65)">
      

  <!-- Octagonal Seal Outer in #0B0B0D -->
  <polygon points="22,8 42,8 56,22 56,42 42,56 22,56 8,42 8,22" fill="#0B0B0D" />
  <!-- Inner Proof Check in #5B6CFF -->
  <polygon points="22,14 42,14 50,22 50,42 42,50 22,50 14,42 14,22" fill="#FFFFFF" />
  <path d="M22 32 L29 39 L42 24" stroke="#5B6CFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />


    </g>
    <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0B0D">4. Proof Stamp Seal</text>
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B">Octagonal geometric verification seal</text>
  </g>

  <!-- Tile 5 -->
  <g transform="translate(350, 370)">
    <rect width="260" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(98, 65)">
      

  <!-- Lens / Reticle ring in #0B0B0D -->
  <circle cx="28" cy="28" r="18" stroke="#0B0B0D" stroke-width="6" />
  <!-- Scanner crosshairs -->
  <line x1="28" y1="4" x2="28" y2="10" stroke="#0B0B0D" stroke-width="4" stroke-linecap="round" />
  <line x1="4" y1="28" x2="10" y2="28" stroke="#0B0B0D" stroke-width="4" stroke-linecap="round" />
  <line x1="28" y1="46" x2="28" y2="52" stroke="#0B0B0D" stroke-width="4" stroke-linecap="round" />
  <!-- Focus Handle -->
  <line x1="42" y1="42" x2="56" y2="56" stroke="#0B0B0D" stroke-width="6" stroke-linecap="round" />
  <!-- Center Verified Check in #5B6CFF breaking outward -->
  <path d="M20 28 L26 34 L40 18" stroke="#5B6CFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />


    </g>
    <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0B0D">5. Scanner Crosshair</text>
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B">Find scanner resolving into proven check</text>
  </g>

  <!-- Tile 6 -->
  <g transform="translate(640, 370)">
    <rect width="260" height="230" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <g transform="translate(98, 65)">
      

  <!-- Before Square (Flaw) in #0B0B0D -->
  <rect x="8" y="16" width="32" height="32" rx="4" fill="#0B0B0D" />
  <!-- After Square (Patch) in #5B6CFF with blend cut -->
  <rect x="24" y="8" width="32" height="32" rx="4" fill="#5B6CFF" fill-opacity="0.9" />
  <!-- Intersection Checkmark -->
  <path d="M19 32 L27 40 L45 20" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />


    </g>
    <text x="130" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#0B0B0D">6. Overlapping Squares</text>
    <text x="130" y="202" text-anchor="middle" font-size="11" font-weight="400" fill="#64748B">Before/after states intersecting into check</text>
  </g>
</svg>
